<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Nested Lisp parentheses around a lambda">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2620" />
      <stop offset="1" stop-color="#134034" />
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)" />
  <g fill="none" stroke-linecap="round">
    <path d="M520 130 q -220 245 0 490" stroke="#34d399" stroke-opacity="0.25" stroke-width="14" />
    <path d="M680 130 q 220 245 0 490" stroke="#34d399" stroke-opacity="0.25" stroke-width="14" />
    <path d="M470 180 q -150 195 0 390" stroke="#34d399" stroke-opacity="0.45" stroke-width="12" />
    <path d="M730 180 q 150 195 0 390" stroke="#34d399" stroke-opacity="0.45" stroke-width="12" />
    <path d="M420 230 q -90 145 0 290" stroke="#6ee7b7" stroke-opacity="0.75" stroke-width="10" />
    <path d="M780 230 q 90 145 0 290" stroke="#6ee7b7" stroke-opacity="0.75" stroke-width="10" />
  </g>
  <text x="600" y="430" text-anchor="middle" fill="#a7f3d0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="128" font-weight="700">&#955;</text>
  <g fill="#6ee7b7" fill-opacity="0.45" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22">
    <text x="70" y="110">(defun fib (n)</text>
    <text x="70" y="146">  (if (&lt; n 2) n</text>
    <text x="70" y="182">    (+ (fib (- n 1))</text>
    <text x="70" y="218">       (fib (- n 2)))))</text>
  </g>
  <g fill="#34d399" fill-opacity="0.35" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22">
    <text x="880" y="664">sbcl --script</text>
  </g>
</svg>
