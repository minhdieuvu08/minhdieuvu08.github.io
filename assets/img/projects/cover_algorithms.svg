<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Binary search narrowing over a sorted array">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1e38" />
      <stop offset="1" stop-color="#11315a" />
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)" />
  <g fill="#60a5fa" fill-opacity="0.22">
    <rect x="80" y="300" width="88" height="150" rx="8" />
    <rect x="188" y="300" width="88" height="150" rx="8" />
    <rect x="296" y="300" width="88" height="150" rx="8" />
    <rect x="404" y="300" width="88" height="150" rx="8" />
    <rect x="728" y="300" width="88" height="150" rx="8" />
    <rect x="836" y="300" width="88" height="150" rx="8" />
    <rect x="944" y="300" width="88" height="150" rx="8" />
    <rect x="1052" y="300" width="68" height="150" rx="8" />
  </g>
  <g fill="#60a5fa" fill-opacity="0.55">
    <rect x="512" y="300" width="88" height="150" rx="8" />
    <rect x="620" y="300" width="88" height="150" rx="8" />
  </g>
  <rect x="512" y="300" width="88" height="150" rx="8" fill="#93c5fd" />
  <g stroke="#93c5fd" stroke-width="4" fill="none" stroke-opacity="0.6">
    <path d="M124 520 L 556 520" />
    <path d="M556 520 L 1086 520" stroke-opacity="0.25" />
  </g>
  <g fill="#93c5fd" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="24" font-weight="700">
    <text x="96" y="576">lo</text>
    <text x="528" y="576">mid</text>
    <text x="1052" y="576">hi</text>
  </g>
  <g fill="#bfdbfe" fill-opacity="0.45" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="26">
    <text x="80" y="160">while (lo &lt;= hi)</text>
    <text x="80" y="204">  mid = lo + (hi - lo) / 2;</text>
  </g>
  <text x="1120" y="204" text-anchor="end" fill="#60a5fa" fill-opacity="0.8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="34" font-weight="700">O(log n)</text>
</svg>
