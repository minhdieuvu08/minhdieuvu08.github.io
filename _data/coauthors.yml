# Co-author name variants for jekyll-scholar, keyed by lowercase last name.
# Lets a .bib entry written as "H. X. Nguyen" render with a full name and a link.
# Only takes effect once _bibliography/papers.bib has entries.
#
# "nguyen":
#   - firstname: ["Hai", "H.", "H. X.", "Hai X."]
#     url: https://example.com/
#
# "huynh":
#   - firstname: ["Son", "S.", "S. T.", "Son T."]
#     url: https://example.com/
