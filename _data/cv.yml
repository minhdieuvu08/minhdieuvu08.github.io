    Experience:
      - company: DIZIM
        position: AI Engineer Intern
        location: Ho Chi Minh City, Vietnam
        start_date: 2025-03
        end_date: 2025-06
        summary: Applied deep learning techniques to practical AI applications and Large Language Models.
        highlights:
          - Developed a fashion advice chatbot using RAG with AWS Bedrock and Amazon OpenSearch.
          - Implemented prompt engineering and vector databases for context-aware responses.
          - Optimized model performance and data classification for real-world deployment.
    
    Projects:
      - name: Instance Segmentation of Medical Equipment in Hospital Environments
        summary: "*Graduation Thesis · July 2026 – present.* PyTorch, Cascade Mask R-CNN, HTC, YOLO, Vision Transformers."
        start_date: 2026-07
        end_date: present
        highlights:
          - Engineered and processed the HAMP dataset, specifically designed for detecting and segmenting medical equipment within complex hospital environments.
          - Benchmarked state-of-the-art architectures (Cascade Mask R-CNN, HTC, Mask R-CNN, YOLOv8/v11) with modern backbones (e.g., ConvNeXt, PVT) across 30+ configurations to evaluate the accuracy-efficiency tradeoff.
          - Achieved peak instance segmentation performance (mAP 57.4) using Hybrid Task Cascade with ConvNeXtv2-L, while analyzing FLOPs and FPS metrics for potential real-world healthcare deployment.

      - name: LLM-Guided Reinforcement Learning Agent
        summary: "*December 2025.* Python, Gymnasium, Gemini API, Prompt Engineering."
        start_date: 2025-12
        end_date: 2025-12
        highlights:
          - Engineered a robust pipeline integrating Google Gemini 2.5 API to dynamically generate programmatic heuristics (Reward Shaping), jump-starting the RL agent's learning process.
          - Built a Semantic Feature Extraction module to process raw pixels into structured JSON (Scene Graphs), explicitly mitigating LLM spatial hallucinations and ensuring reliable API outputs.
          - Combined Tabular Q-Learning with a Population-Based Training framework, resulting in a significant increase in both average score and win rate over baseline models.
          - Designed custom data visualization pipelines using Matplotlib to effectively benchmark model performance and track heuristic accuracy.

      - name: Mental Attention Classification Using EEG Data
        summary: "*December 2024.* Python."
        start_date: 2024-12
        end_date: 2024-12
        highlights:
          - Preprocessed raw EEG signals by extracting relevant channels and applying normalization techniques to ensure data consistency.
          - Extracted time-domain and frequency-domain features (e.g., power spectral density, statistical metrics) to identify patterns across attention states.
          - Trained and evaluated multiple classifiers (e.g., Logistic Regression, SVM, Random Forest, Neural Networks) using accuracy, precision, recall, and F1-score.
          - Generated EEG signal plots, feature comparisons, confusion matrices, and ROC curves for model evaluation.

    Leadership & Activities:
      - company: The IO Scholar
        position: Panelist | Women in Engineering and IT Workshop
        location: Online (Vietnam and Australia)
        start_date: 2026-03
        end_date: 2026-03
        summary: >
          Invited as the youngest panelist to a cross-border professional workshop
          celebrating Women in STEM, alongside senior policy officers, PhD, and Master
          scholars from Australia and Vietnam.
        highlights:
          - Invited to share personal and academic experiences in Mathematical Methods in Informatics.
          - Inspired female students by discussing career orientation, research in Computer Vision/LLMs, and overcoming gender-related challenges in tech.
          - Panel discussion on integrating rigorous Math into modern AI development.
    
