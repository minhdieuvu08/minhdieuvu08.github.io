      - title: High-Precision Segmentation of Complex Hospital Scenes Using the HAMP Dataset
        authors:
          - Hai X. Nguyen
          - Man M. Nguyen*
          - Minh D. Vu*
          - Tuyet-Nhi N. Nguyen*
